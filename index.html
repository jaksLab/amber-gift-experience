<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Amber Gift Experience — a sentimental dark romantic digital castle gift."
    />
    <meta name="theme-color" content="#09070a" />
    <title>Amber Gift Experience</title>
    <style>

      .static-root-fallback {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        color: #f8ecd2;
        background: radial-gradient(circle at 50% 16%, rgba(240, 216, 145, 0.14), transparent 16rem), radial-gradient(circle at 50% 80%, rgba(111, 23, 39, 0.38), transparent 24rem), linear-gradient(180deg, #040305, #120d13 58%, #040305);
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      .static-root-fallback > div {
        width: min(100%, 42rem);
        padding: clamp(1.25rem, 6vw, 3rem);
        border: 1px solid rgba(198, 161, 90, 0.34);
        border-radius: 2rem;
        background: rgba(11, 8, 13, 0.82);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.58), 0 0 54px rgba(198, 161, 90, 0.18);
      }
      .static-root-fallback h1 {
        margin: 0;
        font-size: clamp(3.5rem, 18vw, 8rem);
        font-weight: 500;
        line-height: 1.06;
      }
      .static-root-fallback p {
        color: #c9bda4;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(1.05rem, 4vw, 1.35rem);
      }
      .static-root-fallback button {
        min-height: 3.15rem;
        padding: 0.86rem 1.25rem;
        border: 1px solid rgba(240, 216, 145, 0.72);
        border-radius: 999px;
        color: #19090b;
        background: linear-gradient(135deg, #f0d891, #c6a15a 50%, #8e662b);
        font: 850 1rem Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .no-js-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        min-height: 100svh;
        padding: 1.5rem;
        color: #f8ecd2;
        background: radial-gradient(circle at 50% 20%, rgba(125, 27, 42, 0.34), transparent 22rem), linear-gradient(180deg, #050406, #111016 52%, #050406);
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
      }
      .no-js-fallback h1 {
        margin: 0.35rem 0;
        color: #f8ecd2;
        font-size: clamp(3rem, 17vw, 7rem);
        font-weight: 500;
        line-height: 1.05;
      }
      .no-js-fallback button {
        min-height: 3rem;
        margin-top: 1rem;
        padding: 0.85rem 1.25rem;
        border: 1px solid rgba(240, 216, 145, 0.7);
        border-radius: 999px;
        color: #1b0909;
        background: linear-gradient(135deg, #f0d891, #c7a45a 48%, #8e662a);
        font: 700 1rem system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <noscript>
      <main class="no-js-fallback" aria-label="Amber Gift Experience no JavaScript fallback">
        <h1>For Amber…</h1>
        <p>A little world made with time, patience, and love.</p>
        <button type="button">Enter the Castle</button>
      </main>
    </noscript>
    <div id="root">
      <main class="static-root-fallback" aria-label="Amber Gift Experience static fallback">
        <div>
          <h1>For Amber…</h1>
          <p>A little world made with time, patience, and love.</p>
          <button type="button">Enter the Castle</button>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
